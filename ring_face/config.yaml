name: Ring Face Recognition
version: "0.2.0"
slug: ring_face
description: Silent, local doorbell face recognition and private visitor history
url: https://github.com/deadmeat75/ha-ring-face-recognition
arch: [amd64]
startup: application
boot: manual
init: true
stage: experimental
homeassistant: "2026.4.0"
ingress: true
ingress_port: 8099
panel_icon: mdi:face-recognition
panel_title: Ring visitors
panel_admin: true
backup: cold
map:
  - type: share
    read_only: false
    path: /share
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  timezone: America/Los_Angeles
  similarity_threshold: 0.55
  ambiguity_margin: 0.08
  opencv_threads: 1
  processing_timeout: 20
  capture_timeout: 10
  history_days: 30
  image_days: 0
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  timezone: str
  similarity_threshold: float(0.4,0.95)
  ambiguity_margin: float(0.01,0.5)
  opencv_threads: int(1,2)
  processing_timeout: int(5,60)
  capture_timeout: int(1,60)
  history_days: int(1,365)
  image_days: int(0,30)
